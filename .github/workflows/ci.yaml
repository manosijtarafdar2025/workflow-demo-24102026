name: Python App CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 599194859141
  AWS_ROLE_NAME: github_actions_ecr_role
  ECR_REPOSITORY_NAME: python-app
  GITHUB_REPOSITORY: workflow-demo-24102026
  GITHUB_BRANCH: master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: my-python-app:latest
      
